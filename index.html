<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140B2E">
<title>NEON DASH</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0A0518;
    color:#F6F2FF;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  #wrap{position:fixed;inset:0}
  canvas#game{display:block;width:100%;height:100%;touch-action:none}
  /* Portrait nag on phones. The game keeps running underneath. */
  #rotate{
    position:fixed;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(10,5,24,.94);z-index:40;padding:24px;font-size:18px;letter-spacing:.08em;
  }
  #rotate b{display:block;font-size:26px;color:#2DE2E6;margin-bottom:10px;letter-spacing:.2em}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:grid} }
  /* The only DOM the game uses: a textarea for level import/export. */
  #io{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(760px,92vw);height:min(520px,70vh);display:none;z-index:50;
    background:#12082a;color:#cfe;border:2px solid #2DE2E6;border-radius:10px;
    padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:none;
    box-shadow:0 0 60px rgba(45,226,230,.35)
  }
  #io.on{display:block}
  /* Name entry for the leaderboard. A real input, because only a real input
     raises the virtual keyboard on a phone. */
  #nameinput{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    display:none;z-index:60;width:min(420px,84vw);
    background:#12082a;color:#F6F2FF;border:2px solid #2DE2E6;border-radius:10px;
    padding:16px 18px;font:700 26px "Trebuchet MS",system-ui,sans-serif;
    letter-spacing:.12em;text-align:center;text-transform:uppercase;outline:none;
    box-shadow:0 0 60px rgba(45,226,230,.45)
  }
  #nameinput.on{display:block}
  #nameinput::placeholder{color:rgba(246,242,255,.32);letter-spacing:.12em}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate"><div><b>NEON DASH</b>Rotate your device to landscape</div></div>
<textarea id="io" spellcheck="false"></textarea>
<input id="nameinput" maxlength="14" spellcheck="false" autocomplete="off" placeholder="YOUR NAME">
<script>
"use strict";
/* ==========================================================================
   NEON DASH - a one-button rhythm platformer.
   Single file, Canvas 2D, no build step, no dependencies, runs from file://.

   Layout of this file:
     CORE      constants, object table, level data, level parsing,
               collision and the deterministic physics step   (headless-safe)
     Assets    sprite loading + procedural fallbacks
     Input     keyboard / mouse / touch with a tap buffer
     Audio     WebAudio: synthesised music, SFX, analyser
     Particles trail, explosion, sparks
     Renderer  background -> world -> player -> particles -> HUD
     Save      localStorage with a memory fallback
     Scenes    menu / select / play / pause / end / settings / editor
     Game      fixed-step accumulator loop, decoupled render
   ========================================================================== */

/*==CORE_START==*/
/* --------------------------------------------------------------------------
   CORE - everything up to CORE_END is pure logic: no DOM, no canvas, no audio.
   tools/verify.js evaluates exactly this block in Node to prove every level
   is beatable with the real physics.
   -------------------------------------------------------------------------- */

var COLORS = {
  void:"#140B2E", deep:"#241148", cyan:"#2DE2E6", magenta:"#FF3864",
  gold:"#F9C80E", violet:"#9D4EDD", lime:"#7CFF6B", ink:"#F6F2FF", shadow:"#0A0518"
};

var PHYS = {
  UNIT: 30,
  TIMESTEP: 1/240,          // fixed simulation step; rendering is decoupled
  SPEEDS: { slow:0.807, normal:1.0, fast:1.243, faster:1.502, fastest:1.849 },
  BASE_VX: 311.6,           // 10.386 blocks/s at speed 1

  // Cube: 2 blocks of jump height at every speed. 555^2/(2*2560) = 60.2px = 2.006 blocks.
  CUBE:  { gravity:2560, jumpV:555, maxFall:600, rotDegPerSec:415 },
  MINI:  { scale:0.6, gravityMul:1.25, jumpVMul:0.86 },
  SHIP:  { gravity:1550, thrust:2350, maxUp:470, maxDown:470, tiltMaxDeg:28 },
  BALL:  { gravity:2000, maxFall:470, flipCooldown:0.08 },
  UFO:   { gravity:2000, impulse:430, maxFall:480 },
  WAVE:  { slopeRatio:1.0, miniSlopeRatio:1.6 },
  ROBOT: { gravity:2560, jumpV:555, maxChargeSec:0.30, maxJumpMul:1.35 },

  CEIL_BLOCKS: 12,          // solid roof; reverse gravity lands you on it
  TAP_BUFFER: 6/60,         // orb forgiveness: 6 frames either side of contact
  COYOTE: 0.055,            // grace period for jumps just after leaving a ledge
  DEATH_FLOOR: -6,          // fall past this (in blocks) and you die
};

/* Impulse needed to rise `blocks` blocks under `gravity`: v = sqrt(2*g*h).
   Keeps pad and orb strengths readable in level-design terms. */
function impulseFor(blocks, gravity){ return Math.sqrt(2 * gravity * blocks * PHYS.UNIT); }

/* --------------------------------------------------------------------------
   Object table. Sizes in blocks. A cell's origin is its bottom-left corner at
   (x, y), where y counts up from the floor line, so y:0 rests on the floor.
   `hit` is the lethal box for hazards: deliberately far smaller than the art.
   -------------------------------------------------------------------------- */
var OBJ = {
  /* hazards ----------------------------------------------------------- */
  "spike":        { w:1,   h:1,   kind:"hazard", hit:{w:0.40,h:0.50}, sprite:"spike" },
  "spike-mini":   { w:1,   h:0.5, kind:"hazard", hit:{w:0.40,h:0.25}, sprite:"spike-mini" },
  "spike-triple": { w:3,   h:1,   kind:"hazard", hit:{w:0.40,h:0.50}, repeat:3, sprite:"spike-triple" },
  "saw":          { w:1.5, h:1.5, kind:"hazard", circle:0.55, spin:-320, sprite:"saw" },

  /* solids ------------------------------------------------------------ */
  "block":        { w:1, h:1,   kind:"solid", sprite:"block" },
  "block-half":   { w:1, h:0.5, kind:"solid", sprite:"block-half" },
  "slope":        { w:1, h:1,   kind:"slope", sprite:"slope" },

  /* pads - fire automatically on contact -------------------------------- */
  "pad-yellow":   { w:1, h:0.4, kind:"pad", jump:3.2, sprite:"pad-yellow" },
  "pad-pink":     { w:1, h:0.4, kind:"pad", jump:1.6, sprite:"pad-pink" },
  "pad-red":      { w:1, h:0.4, kind:"pad", jump:4.5, sprite:"pad-red" },
  "pad-blue":     { w:1, h:0.4, kind:"pad", flip:true, jump:0.9, sprite:"pad-blue" },

  /* orbs - fire only if the player taps while touching them -------------- */
  "orb-yellow":   { w:1, h:1, kind:"orb", circle:0.75, jump:2.0,  sprite:"orb-yellow" },
  "orb-pink":     { w:1, h:1, kind:"orb", circle:0.75, jump:1.5,  sprite:"orb-pink" },
  "orb-red":      { w:1, h:1, kind:"orb", circle:0.75, jump:3.5,  sprite:"orb-red" },
  "orb-blue":     { w:1, h:1, kind:"orb", circle:0.75, flip:true, jump:0.7, sprite:"orb-blue" },
  "orb-green":    { w:1, h:1, kind:"orb", circle:0.75, flip:true, jump:2.0, sprite:"orb-green" },
  "orb-dash":     { w:1, h:1, kind:"orb", circle:0.75, dash:true, sprite:"orb-dash" },

  /* pickups ------------------------------------------------------------- */
  "coin":         { w:1, h:1, kind:"coin", circle:0.5, sprite:"coin" },

  /* portals ------------------------------------------------------------- */
  "portal-cube":  { w:1, h:2, kind:"portal", mode:"cube",  sprite:"portal-cube" },
  "portal-ship":  { w:1, h:2, kind:"portal", mode:"ship",  sprite:"portal-ship" },
  "portal-ball":  { w:1, h:2, kind:"portal", mode:"ball",  sprite:"portal-ball" },
  "portal-ufo":   { w:1, h:2, kind:"portal", mode:"ufo",   sprite:"portal-ufo" },
  "portal-wave":  { w:1, h:2, kind:"portal", mode:"wave",  sprite:"portal-wave" },
  "portal-robot": { w:1, h:2, kind:"portal", mode:"robot", sprite:"portal-robot" },
  "portal-gravity-up":   { w:1, h:2, kind:"portal", grav:-1, sprite:"portal-gravity-up" },
  "portal-gravity-down": { w:1, h:2, kind:"portal", grav: 1, sprite:"portal-gravity-down" },
  "portal-mini":  { w:1, h:2, kind:"portal", mini:true,   sprite:"portal-mini" },
  "portal-big":   { w:1, h:2, kind:"portal", mini:false,  sprite:"portal-big" },
  "portal-dual":  { w:1, h:2, kind:"portal", dual:true,   sprite:"portal-dual" },
  "portal-mirror":{ w:1, h:2, kind:"portal", mirror:true, sprite:"portal-mirror" },

  /* speed changers ------------------------------------------------------- */
  "speed-slow":   { w:1, h:1, kind:"portal", speed:0.807, sprite:"speed-slow" },
  "speed-normal": { w:1, h:1, kind:"portal", speed:1.0,   sprite:"speed-normal" },
  "speed-fast":   { w:1, h:1, kind:"portal", speed:1.243, sprite:"speed-fast" },
  "speed-faster": { w:1, h:1, kind:"portal", speed:1.502, sprite:"speed-faster" },
  "speed-fastest":{ w:1, h:1, kind:"portal", speed:1.849, sprite:"speed-fastest" },

  /* end of level ---------------------------------------------------------- */
  "finish":       { w:1, h:8, kind:"finish" },
};

/* Sprite footprint per gamemode, in blocks. The hitbox is 15% smaller. */
var MODES = {
  cube:  { w:1,    h:1,    sprite:"cube" },
  ship:  { w:1.5,  h:1,    sprite:"ship" },
  ball:  { w:1,    h:1,    sprite:"ball" },
  ufo:   { w:1.13, h:0.86, sprite:"ufo" },
  wave:  { w:0.8,  h:0.8,  sprite:"wave" },
  robot: { w:1,    h:1.13, sprite:"robot" },
};
var HITBOX_SHRINK = 0.85;
var MODE_LIST = ["cube","ship","ball","ufo","wave","robot"];

/* --------------------------------------------------------------------------
   Level parsing. Turns the authoring JSON (see assets/levels/level-schema.json)
   into three x-sorted lists - solids, hazards, triggers - so each frame only
   has to look at the handful of objects near the player.
   -------------------------------------------------------------------------- */

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function parseLevel(src){
  var U = PHYS.UNIT;
  var meta = {
    id:"level", name:"Untitled", difficulty:"easy", bpm:120,
    music:null, musicOffsetMs:0, startMode:"cube", startSpeed:1,
    lengthBlocks:200, bgColor:COLORS.void, groundColor:COLORS.deep, hue:0
  };
  for(var k in (src.meta||{})) meta[k] = src.meta[k];

  var objects=[], solids=[], slopes=[], hazards=[], triggers=[];
  var raw = src.objects || [];

  for(var i=0;i<raw.length;i++){
    var o = raw[i], def = OBJ[o.t];
    if(!def) continue;                                  // unknown ids are skipped, not fatal
    var sc  = o.scale || 1;
    var rot = ((o.rot|0) % 360 + 360) % 360;
    var rec = {
      idx: objects.length, t:o.t, def:def, rot:rot, scale:sc, flip:!!o.flip,
      gx:o.x, gy:o.y,
      x: o.x*U, y: o.y*U,                                // cell origin, bottom-left
      x0: o.x*U,                                         // alias so lowerBound() works on this list
      w: def.w*U*sc, h: def.h*U*sc
    };
    objects.push(rec);

    var x0=rec.x, y0=rec.y, x1=rec.x+rec.w, y1=rec.y+rec.h;
    var cx=(x0+x1)/2, cy=(y0+y1)/2;

    switch(def.kind){
      case "solid":
        solids.push({x0:x0,y0:y0,x1:x1,y1:y1,o:rec});
        break;

      case "slope":
        // Ramp rising to the right, or to the left when flipped.
        slopes.push({x0:x0,y0:y0,x1:x1,y1:y1,rise:(rec.flip?-1:1),o:rec});
        break;

      case "hazard":
        if(def.circle){
          hazards.push({x0:cx-def.circle*U*sc, x1:cx+def.circle*U*sc,
                        y0:cy-def.circle*U*sc, y1:cy+def.circle*U*sc,
                        cx:cx, cy:cy, r:def.circle*U*sc, o:rec});
        } else {
          var n = def.repeat || 1;
          for(var k2=0;k2<n;k2++) hazards.push(spikeBox(rec, k2, n));
        }
        break;

      case "pad": case "orb": case "coin": case "portal": case "finish":
        var tr = {x0:x0,y0:y0,x1:x1,y1:y1,kind:def.kind,o:rec};
        if(def.circle){ tr.cx=cx; tr.cy=cy; tr.r=def.circle*U*sc;
                        tr.x0=cx-tr.r; tr.x1=cx+tr.r; tr.y0=cy-tr.r; tr.y1=cy+tr.r; }
        // Portals get 0.6 blocks of vertical slack so a level authored with the
        // portal drawn beside the player's path still fires reliably.
        if(def.kind==="portal"){ tr.y0 -= 0.6*U; tr.y1 += 0.6*U; }
        // Mode and gravity gates mark mandatory section transitions. Flying
        // above or below the artwork must not bypass the next section's rules.
        if(def.kind==="portal" && (def.mode || def.grav !== undefined)){
          tr.y0 = -U;
          tr.y1 = (PHYS.CEIL_BLOCKS+1)*U;
        }
        if(def.kind==="finish"){ tr.x0=x0; tr.x1=x0+U*0.4; tr.y0=-U*4; tr.y1=y0+def.h*U; }
        triggers.push(tr);
        break;
    }
  }

  var bySortX = function(a,b){ return a.x0-b.x0; };
  solids.sort(bySortX); slopes.sort(bySortX); hazards.sort(bySortX); triggers.sort(bySortX);

  // Coins get stable slots 0..2 so saves stay meaningful when a level is edited.
  var coinSlot = 0;
  for(var ti=0; ti<triggers.length; ti++)
    if(triggers[ti].kind==="coin") triggers[ti].slot = coinSlot++;

  var finishX = meta.lengthBlocks*U;
  for(var t2=0;t2<triggers.length;t2++)
    if(triggers[t2].kind==="finish") finishX = triggers[t2].x0;

  // Draw order is x-sorted while `objects` keeps authoring order, because the
  // `used` flags are indexed by position in `objects`.
  var draw = objects.slice().sort(bySortX);

  return {
    meta:meta, objects:objects, draw:draw,
    solids:solids, slopes:slopes, hazards:hazards, triggers:triggers,
    finishX:finishX, coinCount:coinSlot,
    beatBlocks: (PHYS.BASE_VX*meta.startSpeed)/PHYS.UNIT*(60/meta.bpm)
  };
}

/* Lethal box for a spike. Roughly 40% of the artwork, hugging the base, so a
   correctly-timed jump never dies on a corner of the drawing. */
function spikeBox(rec, k, n){
  var U = PHYS.UNIT, def = rec.def, sc = rec.scale;
  var cw = (def.w/n)*U*sc, ch = def.h*U*sc;
  var x0 = rec.x + k*cw, y0 = rec.y;
  var hw = def.hit.w*U*sc, hh = def.hit.h*U*sc;
  var b;
  switch(rec.rot){
    case 180:  // pointing down: base at the top of the cell
      b = {x0:x0+(cw-hw)/2, x1:x0+(cw+hw)/2, y0:y0+ch-hh, y1:y0+ch}; break;
    case 90:   // pointing right: base on the left edge
      b = {x0:x0, x1:x0+hh, y0:y0+(ch-hw)/2, y1:y0+(ch+hw)/2}; break;
    case 270:  // pointing left: base on the right edge
      b = {x0:x0+cw-hh, x1:x0+cw, y0:y0+(ch-hw)/2, y1:y0+(ch+hw)/2}; break;
    default:   // pointing up
      b = {x0:x0+(cw-hw)/2, x1:x0+(cw+hw)/2, y0:y0, y1:y0+hh};
  }
  b.o = rec; b.sub = k;
  return b;
}

/* First index whose x0 could still reach x. Lists are x-sorted and no object is
   wider than 4 blocks, so stepping back by that much is always enough. */
function lowerBound(list, x){
  var lo=0, hi=list.length, target = x - PHYS.UNIT*4;
  while(lo<hi){ var mid=(lo+hi)>>1; if(list[mid].x0 < target) lo=mid+1; else hi=mid; }
  return lo;
}

/* --------------------------------------------------------------------------
   Simulation state. Everything that changes during an attempt lives here and
   nothing else does, which is what makes cloneSim() enough for both practice
   checkpoints and the offline solver's search tree.
   -------------------------------------------------------------------------- */

function makeEntity(level, mirror){
  var m = MODES[level.meta.startMode] || MODES.cube;
  var h = m.h*PHYS.UNIT*HITBOX_SHRINK;
  return {
    x: 0,
    y: mirror ? PHYS.CEIL_BLOCKS*PHYS.UNIT - h/2 : h/2,
    vx: PHYS.BASE_VX*(level.meta.startSpeed||1),
    vy: 0,
    mode: level.meta.startMode||"cube",
    grav: mirror ? -1 : 1,
    mini: false,
    speed: level.meta.startSpeed||1,
    mirror: !!mirror,
    onGround: true, groundT: 0,
    rot: 0, tilt: 0,
    alive: true,
    ballCd: -99, robotT: -99, robotHeld: false,
    dashing: false, dashT: 0,
    padCd: -1, padCdT: -99,
    nearOrb: -1, nearOrbT: -99
  };
}

function createSim(level){
  return {
    level: level,
    t: 0,
    ents: [ makeEntity(level, false) ],
    used: new Uint8Array(level.objects.length),   // orbs and portals fire once per attempt
    coins: [0,0,0],
    dead: false, won: false,
    deathX: 0, deathY: 0,
    progress: 0,
    mirrorView: false,
    hold: false, pressed: false,
    lastTapT: -99, lastReleaseT: -99,
    events: []
  };
}

function cloneSim(s){
  var ents = new Array(s.ents.length);
  for(var i=0;i<s.ents.length;i++){
    var e = s.ents[i], c = {};
    for(var k in e) c[k] = e[k];
    ents[i] = c;
  }
  return {
    level:s.level, t:s.t, ents:ents,
    used: s.used.slice(0), coins: s.coins.slice(0),
    dead:s.dead, won:s.won, deathX:s.deathX, deathY:s.deathY,
    progress:s.progress, mirrorView:s.mirrorView,
    hold:s.hold, pressed:false, lastTapT:s.lastTapT, lastReleaseT:s.lastReleaseT,
    events: []
  };
}

/* Feed the input edge. Call once per physics step, immediately before stepSim. */
function simInput(sim, hold){
  sim.pressed = hold && !sim.hold;
  if(sim.pressed) sim.lastTapT = sim.t;
  if(!hold && sim.hold) sim.lastReleaseT = sim.t;
  sim.hold = hold;
}

function entBox(e){
  var m = MODES[e.mode], s = e.mini ? PHYS.MINI.scale : 1;
  return { w: m.w*PHYS.UNIT*s*HITBOX_SHRINK, h: m.h*PHYS.UNIT*s*HITBOX_SHRINK };
}
function entGravity(e){
  var mul = e.mini ? PHYS.MINI.gravityMul : 1;
  switch(e.mode){
    case "ship": return PHYS.SHIP.gravity*mul;
    case "ball": return PHYS.BALL.gravity*mul;
    case "ufo":  return PHYS.UFO.gravity*mul;
    default:     return PHYS.CUBE.gravity*mul;
  }
}

/* --------------------------------------------------------------------------
   Swept AABB. The player collapses to a point and the obstacle is inflated by
   the player's half-extents, which reduces the test to a ray/box slab sweep.
   The surface normal it returns is what separates a landing (vertical normal)
   from a fatal wall hit (horizontal normal).
   -------------------------------------------------------------------------- */
function sweepPointBox(px,py,dx,dy, x0,y0,x1,y1){
  var tmin=-Infinity, tmax=Infinity, nx=0, ny=0, a, b, s, tmp;

  if(dx > -1e-9 && dx < 1e-9){
    if(px <= x0 || px >= x1) return null;            // no overlap and no motion
  } else {
    a=(x0-px)/dx; b=(x1-px)/dx; s=-1;
    if(a>b){ tmp=a; a=b; b=tmp; s=1; }
    if(a>tmin){ tmin=a; nx=s; ny=0; }
    if(b<tmax) tmax=b;
  }
  if(dy > -1e-9 && dy < 1e-9){
    if(py <= y0 || py >= y1) return null;
  } else {
    a=(y0-py)/dy; b=(y1-py)/dy; s=-1;
    if(a>b){ tmp=a; a=b; b=tmp; s=1; }
    if(a>tmin){ tmin=a; nx=0; ny=s; }
    if(b<tmax) tmax=b;
  }
  if(tmin > tmax || tmin >= 1 || tmax <= 0) return null;
  if(tmin < 0) return null;                          // already inside; depenetrate deals with it
  return { t:tmin, nx:nx, ny:ny };
}

var SWEEP_PLANES = [
  {x0:-1e9, x1:1e9, y0:-1e9, y1:0, plane:"floor"},   // the ground
  {x0:-1e9, x1:1e9, y0:0,    y1:1e9, plane:"roof"}   // y0 patched to the ceiling height
];

/* Earliest contact between the player box and any solid, including the two
   world planes: the floor at y=0 and the roof at y=CEIL_BLOCKS. */
function sweepWorld(sim, px, py, pw, ph, dx, dy){
  var best=null, hw=pw/2, hh=ph/2, i, h2;
  SWEEP_PLANES[1].y0 = PHYS.CEIL_BLOCKS*PHYS.UNIT;

  for(i=0;i<2;i++){
    var pl = SWEEP_PLANES[i];
    h2 = sweepPointBox(px,py,dx,dy, pl.x0-hw, pl.y0-hh, pl.x1+hw, pl.y1+hh);
    if(h2 && (!best || h2.t < best.t)){ best=h2; best.solid=pl; }
  }
  var list = sim.level.solids;
  var minX = (dx<0 ? px+dx : px) - hw, maxX = (dx<0 ? px : px+dx) + hw;
  for(i=lowerBound(list, minX); i<list.length; i++){
    var s = list[i];
    if(s.x0 > maxX) break;
    h2 = sweepPointBox(px,py,dx,dy, s.x0-hw, s.y0-hh, s.x1+hw, s.y1+hh);
    if(h2 && (!best || h2.t < best.t)){ best=h2; best.solid=s; }
  }
  return best;
}

/* Push the player out of anything it is already inside, along the shallowest
   axis. A numerical safety net, mostly for the frame a size portal fires on. */
function depenetrate(sim, e, pw, ph){
  var hw=pw/2, hh=ph/2, ceil=PHYS.CEIL_BLOCKS*PHYS.UNIT;
  if(e.y-hh < 0){ e.y = hh; if(e.vy<0) e.vy=0; }
  if(e.y+hh > ceil){ e.y = ceil-hh; if(e.vy>0) e.vy=0; }
  var list = sim.level.solids;
  for(var i=lowerBound(list, e.x-hw); i<list.length; i++){
    var s = list[i];
    if(s.x0 > e.x+hw) break;
    if(e.x+hw<=s.x0 || e.x-hw>=s.x1 || e.y+hh<=s.y0 || e.y-hh>=s.y1) continue;
    var ox = Math.min(s.x1-(e.x-hw), (e.x+hw)-s.x0);
    var oy = Math.min(s.y1-(e.y-hh), (e.y+hh)-s.y0);
    if(oy <= ox){ e.y = (e.y > (s.y0+s.y1)/2) ? s.y1+hh : s.y0-hh; e.vy = 0; }
    else       { e.x = (e.x > (s.x0+s.x1)/2) ? s.x1+hw : s.x0-hw; }
  }
}

/* Ramps resolve as a height field rather than as boxes: cheaper, and it gives
   the smooth climb-and-launch that makes slopes feel good instead of sticky. */
function resolveSlopes(sim, e, ph){
  var list = sim.level.slopes; if(!list.length) return false;
  var hh = ph/2, on = false;
  for(var i=lowerBound(list, e.x); i<list.length; i++){
    var s = list[i];
    if(s.x0 > e.x) break;
    if(e.x < s.x0 || e.x > s.x1) continue;
    var f = (e.x-s.x0)/(s.x1-s.x0); if(s.rise<0) f = 1-f;
    var grade = (s.y1-s.y0)/(s.x1-s.x0)*s.rise;
    if(e.grav > 0){
      var sy = s.y0 + f*(s.y1-s.y0);
      if(e.y-hh < sy+2 && e.y-hh > s.y0-18){
        e.y = sy+hh; on = true;
        var climb = e.vx*grade; if(climb > e.vy) e.vy = climb;
      }
    } else {
      var syi = s.y1 - f*(s.y1-s.y0);
      if(e.y+hh > syi-2 && e.y+hh < s.y1+18){
        e.y = syi-hh; on = true;
        var climb2 = -e.vx*grade; if(climb2 < e.vy) e.vy = climb2;
      }
    }
  }
  return on;
}

/* Move with collision. X and Y are swept separately: a pure-X sweep ignores
   solids the player is exactly level with, so running across a flat row of
   blocks never registers as a wall, while genuinely clipping a corner still
   does. Any horizontal contact is fatal; vertical contact lands or bumps. */
function moveAndCollide(sim, e, dt){
  var b = entBox(e), pw = b.w, ph = b.h;
  var dx = e.vx*dt, dy = e.vy*dt;

  var hit = sweepWorld(sim, e.x, e.y, pw, ph, dx, 0);
  if(hit){
    e.x += dx*hit.t - (dx>0?0.01:-0.01);
    return { fatal:true, landed:false };
  }
  e.x += dx;

  var landed = false;
  hit = sweepWorld(sim, e.x, e.y, pw, ph, 0, dy);
  if(hit){
    var s = hit.solid;
    if(hit.ny > 0){ e.y = s.y1 + ph/2; } else { e.y = s.y0 - ph/2; }
    landed = (hit.ny*e.grav > 0);
    e.vy = 0;
  } else {
    e.y += dy;
  }

  if(resolveSlopes(sim, e, ph)) landed = true;
  depenetrate(sim, e, pw, ph);
  return { fatal:false, landed:landed };
}

/* --------------------------------------------------------------------------
   The six gamemodes, the interactive objects, and the fixed physics step.
   Gravity is signed: e.grav = +1 pulls toward -y, -1 pulls toward +y, so every
   rule below reads the same whichever way up the player is.
   -------------------------------------------------------------------------- */

function ev(sim, type, e, extra){
  sim.events.push({ type:type, x:e.x, y:e.y, mode:e.mode, extra:extra });
}
function clampFall(e, maxFall){
  if(e.vy*e.grav < -maxFall) e.vy = -maxFall*e.grav;
}
function kill(sim, e){
  if(!e.alive) return;
  e.alive = false; sim.dead = true;
  sim.deathX = e.x; sim.deathY = e.y;
  ev(sim, "death", e);
}

function applyBoost(sim, e, def){
  if(def.dash){                       // dash orb: straight line until you let go
    e.dashing = true; e.dashT = sim.t; e.vy = 0;
    e.onGround = false; e.groundT = -99;
    return;
  }
  e.dashing = false;
  if(def.flip) e.grav = -e.grav;
  if(def.jump){
    var g = entGravity(e);
    e.vy = impulseFor(def.jump, g) * e.grav;
  }
  e.onGround = false; e.groundT = -99;
}

/* Size and mode changes keep the player's feet where they were, so a portal
   never drops you into the floor or pops you through a ceiling. */
function reshape(e, apply){
  var ob = entBox(e);
  var foot = e.grav>0 ? e.y-ob.h/2 : e.y+ob.h/2;
  apply();
  var nb = entBox(e);
  e.y = e.grav>0 ? foot+nb.h/2 : foot-nb.h/2;
}

function applyPortal(sim, e, def){
  var ents = sim.ents, i;
  if(def.mode && def.mode !== e.mode){
    for(i=0;i<ents.length;i++){
      (function(t){ reshape(t, function(){ t.mode = def.mode; }); t.vy = 0; t.dashing = false; })(ents[i]);
    }
    ev(sim, "portal", e, def.mode);
  }
  if(def.grav !== undefined){
    for(i=0;i<ents.length;i++){
      var want = ents[i].mirror ? -def.grav : def.grav;
      if(ents[i].grav !== want){ ents[i].grav = want; ents[i].onGround = false; ents[i].groundT = -99; }
    }
    ev(sim, "portal", e, "gravity");
  }
  if(def.mini !== undefined && def.mini !== e.mini){
    for(i=0;i<ents.length;i++){
      (function(t){ reshape(t, function(){ t.mini = def.mini; }); })(ents[i]);
    }
    ev(sim, "portal", e, def.mini?"mini":"big");
  }
  if(def.speed){
    for(i=0;i<ents.length;i++) ents[i].speed = def.speed;
    ev(sim, "speed", e, def.speed);
  }
  if(def.mirror){ sim.mirrorView = !sim.mirrorView; ev(sim, "mirror", e); }
  if(def.dual){
    if(sim.ents.length === 1){
      var c = {}; for(var k in e) c[k] = e[k];
      c.mirror = true;
      c.grav = -e.grav;
      c.y = PHYS.CEIL_BLOCKS*PHYS.UNIT - e.y;
      c.vy = -e.vy;
      c.nearOrb = -1; c.padCd = -1; c.onGround = false; c.groundT = -99;
      sim.ents.push(c);
    } else {
      for(i=sim.ents.length-1;i>0;i--) if(sim.ents[i].mirror) sim.ents.splice(i,1);
    }
    ev(sim, "portal", e, "dual");
  }
}

function checkHazards(sim, e, pw, ph){
  var hw=pw/2, hh=ph/2, list=sim.level.hazards;
  for(var i=lowerBound(list, e.x-hw); i<list.length; i++){
    var z = list[i];
    if(z.x0 > e.x+hw) break;
    if(z.r !== undefined){
      var nx = clamp(z.cx, e.x-hw, e.x+hw) - z.cx;
      var ny = clamp(z.cy, e.y-hh, e.y+hh) - z.cy;
      if(nx*nx + ny*ny <= z.r*z.r) return true;
    } else if(e.x+hw > z.x0 && e.x-hw < z.x1 && e.y+hh > z.y0 && e.y-hh < z.y1){
      return true;
    }
  }
  return false;
}

function checkTriggers(sim, e, pw, ph){
  var hw=pw/2, hh=ph/2, list=sim.level.triggers;
  for(var i=lowerBound(list, e.x-hw); i<list.length; i++){
    var tr = list[i];
    if(tr.x0 > e.x+hw) break;
    var over;
    if(tr.r !== undefined){
      var nx = clamp(tr.cx, e.x-hw, e.x+hw) - tr.cx;
      var ny = clamp(tr.cy, e.y-hh, e.y+hh) - tr.cy;
      over = (nx*nx + ny*ny <= tr.r*tr.r);
    } else {
      over = (e.x+hw > tr.x0 && e.x-hw < tr.x1 && e.y+hh > tr.y0 && e.y-hh < tr.y1);
    }
    if(!over) continue;

    var o = tr.o, def = o.def, idx = o.idx;
    switch(tr.kind){
      case "coin":
        if(!sim.used[idx]){ sim.used[idx]=1; sim.coins[tr.slot]=1; ev(sim,"coin",e); }
        break;
      case "pad":
        // Pads fire on touch. A short cooldown stops one pad firing every step.
        if(e.padCd !== idx || sim.t - e.padCdT > 0.30){
          applyBoost(sim, e, def); e.padCd = idx; e.padCdT = sim.t; ev(sim,"pad",e,o.t);
        }
        break;
      case "orb":
        // Orbs fire only if the button is down while touching them. Remember the
        // contact so a tap up to TAP_BUFFER later still counts (see below).
        e.nearOrb = idx; e.nearOrbT = sim.t;
        if(!sim.used[idx] && (sim.hold || sim.t - sim.lastTapT <= PHYS.TAP_BUFFER)){
          sim.used[idx]=1; applyBoost(sim, e, def); ev(sim,"orb",e,o.t);
        }
        break;
      case "portal":
        if(!sim.used[idx]){ sim.used[idx]=1; applyPortal(sim, e, def); }
        break;
      case "finish":
        sim.won = true; ev(sim,"win",e);
        break;
    }
  }
  // Late half of the orb buffer: a tap just after leaving an orb still counts.
  if(sim.pressed && e.nearOrb >= 0 && !sim.used[e.nearOrb] &&
     sim.t - e.nearOrbT <= PHYS.TAP_BUFFER){
    var ro = sim.level.objects[e.nearOrb];
    sim.used[e.nearOrb] = 1; applyBoost(sim, e, ro.def); ev(sim,"orb",e,ro.t);
  }
}

function updateRotation(sim, e, dt){
  switch(e.mode){
    case "cube": case "robot":
      if(e.onGround){
        var snap = Math.round(e.rot/90)*90;
        e.rot += (snap-e.rot) * Math.min(1, dt*22);
      } else {
        e.rot += PHYS.CUBE.rotDegPerSec*dt*e.grav;
      }
      break;
    case "ball":
      e.rot += (e.vx/(PHYS.UNIT*0.5))*(180/Math.PI)*dt*e.grav*0.5;
      break;
    case "ship": case "ufo":
      var want = clamp(e.vy/PHYS.SHIP.maxUp, -1, 1)*PHYS.SHIP.tiltMaxDeg*e.grav;
      e.tilt += (want-e.tilt)*Math.min(1, dt*14);
      e.rot = -e.tilt;            // rot is stored screen-clockwise, so nose up when rising
      break;
    case "wave":
      e.rot = (sim.hold ? -45 : 45)*e.grav;
      break;
  }
}

function stepEntity(sim, e, dt){
  var g = entGravity(e);
  var miniJ = e.mini ? PHYS.MINI.jumpVMul : 1;
  e.vx = PHYS.BASE_VX*e.speed;

  if(e.dashing){
    // Dash orb: a flat line, gravity suspended, until release or timeout.
    e.vy = 0;
    if(!sim.hold || sim.t - e.dashT > 1.2) e.dashing = false;
  } else {
    var canJump = (e.onGround || sim.t-e.groundT < PHYS.COYOTE) && e.vy*e.grav <= 1;
    switch(e.mode){

      case "cube":
        if(sim.hold && canJump){
          e.vy = PHYS.CUBE.jumpV*miniJ*e.grav;
          e.onGround = false; e.groundT = -99; ev(sim,"jump",e);
        } else {
          e.vy -= g*e.grav*dt;
        }
        clampFall(e, PHYS.CUBE.maxFall);
        break;

      case "robot":
        if(sim.hold && canJump){
          e.vy = PHYS.ROBOT.jumpV*miniJ*e.grav;
          e.robotT = sim.t; e.robotHeld = true;
          e.onGround = false; e.groundT = -99; ev(sim,"jump",e);
        } else {
          // Holding keeps gravity light for up to maxChargeSec: ~1.37x the height.
          var gm = 1;
          if(e.robotHeld && sim.hold && sim.t-e.robotT < PHYS.ROBOT.maxChargeSec && e.vy*e.grav > 0) gm = 0.73;
          else e.robotHeld = false;
          e.vy -= g*gm*e.grav*dt;
        }
        clampFall(e, PHYS.CUBE.maxFall);
        break;

      case "ball":
        if(sim.pressed && canJump && sim.t-e.ballCd > PHYS.BALL.flipCooldown){
          e.grav = -e.grav; e.vy = 0; e.ballCd = sim.t;
          e.onGround = false; e.groundT = -99; ev(sim,"flip",e);
        }
        e.vy -= g*e.grav*dt;
        clampFall(e, PHYS.BALL.maxFall);
        break;

      case "ufo":
        if(sim.pressed){
          e.vy = PHYS.UFO.impulse*miniJ*e.grav;
          e.onGround = false; e.groundT = -99; ev(sim,"jump",e);
        }
        e.vy -= g*e.grav*dt;
        clampFall(e, PHYS.UFO.maxFall);
        break;

      case "ship":
        e.vy += (sim.hold ? PHYS.SHIP.thrust : -PHYS.SHIP.gravity)*e.grav*dt*(e.mini?1.12:1);
        if(e.vy*e.grav >  PHYS.SHIP.maxUp)   e.vy =  PHYS.SHIP.maxUp*e.grav;
        if(e.vy*e.grav < -PHYS.SHIP.maxDown) e.vy = -PHYS.SHIP.maxDown*e.grav;
        break;

      case "wave":
        // No inertia at all: a fixed diagonal, direction chosen by the button.
        e.vy = (sim.hold?1:-1)*e.vx*(e.mini?PHYS.WAVE.miniSlopeRatio:PHYS.WAVE.slopeRatio)*e.grav;
        break;
    }
  }

  var b = entBox(e);
  var res = moveAndCollide(sim, e, dt);

  if(res.landed){ e.onGround = true; e.groundT = sim.t; }
  else {
    var probe = sweepWorld(sim, e.x, e.y, b.w, b.h, 0, -1.6*e.grav);
    if(probe && probe.ny*e.grav > 0){ e.onGround = true; e.groundT = sim.t; }
    else e.onGround = false;
  }

  if(res.fatal){ kill(sim, e); return; }
  if(checkHazards(sim, e, b.w, b.h)){ kill(sim, e); return; }
  checkTriggers(sim, e, b.w, b.h);
  updateRotation(sim, e, dt);
  if(e.y < PHYS.DEATH_FLOOR*PHYS.UNIT || e.y > (PHYS.CEIL_BLOCKS-PHYS.DEATH_FLOOR)*PHYS.UNIT) kill(sim, e);
}

function stepSim(sim, dt){
  if(sim.dead || sim.won){ sim.t += dt; return; }
  sim.t += dt;
  for(var i=0;i<sim.ents.length;i++){
    var e = sim.ents[i];
    if(e.alive) stepEntity(sim, e, dt);
  }
  sim.progress = clamp(sim.ents[0].x / sim.level.finishX, 0, 1);
}
