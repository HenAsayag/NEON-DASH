  var L = LEVELS[idx], id = L.meta.id;
  drawBackground(g, v, L, GameTime, Sound.bass);

  txt(g, "LEADERBOARD", W/2, H*0.085, S*0.055, COLORS.ink, "center", COLORS.cyan);

  /* level tabs */
  var n = LEVELS.length;
  var tw = Math.min((W*0.82)/n, 210), th = Math.max(34, S*0.055), gp = S*0.010;
  var x0 = (W - (tw*n + gp*(n-1)))/2, ty = H*0.155;
  beginUI();
  for(var i=0;i<n;i++){
    var on = (i === idx);
    if(btn(g, (i+1) + "  " + LEVELS[i].meta.name, x0 + i*(tw+gp), ty, tw, th,
           { accent: on ? COLORS.gold : COLORS.cyan })){
      Game.scoreLevel = i;
      Leaderboard.load(LEVELS[i].meta.id);
    }
    if(on){
      g.fillStyle = COLORS.gold;
      g.fillRect(x0 + i*(tw+gp) + tw*0.2, ty + th + 4, tw*0.6, 3);
    }
  }

  /* where the data came from - never leave that ambiguous */
  var st = Leaderboard.status[id];
  txt(g, Leaderboard.statusLabel(id), W/2, ty + th + S*0.048, S*0.022,
      st === "online" ? COLORS.lime : (st === "error" ? COLORS.magenta : "rgba(246,242,255,.5)"),
      "center", null, "normal");

  /* rows */
  var rows = Leaderboard.rows[id] || [];
  var listW = Math.min(W*0.76, 760), lx = (W-listW)/2;
  var rowH = Math.max(30, S*0.052), ly = ty + th + S*0.112;
  var shown = Math.min(rows.length, LEADERBOARD.topN);

  if(!shown){
    txt(g, "No scores yet.", W/2, ly + rowH*1.5, S*0.034, "rgba(246,242,255,.6)", "center");
    txt(g, "Finish a run - even a failed one posts your best percent.",
        W/2, ly + rowH*2.6, S*0.024, "rgba(246,242,255,.4)", "center", null, "normal");
  }

  // column header, so the numbers are not a guessing game
  if(shown){
    var hy = ly - rowH*0.62;
    txt(g, "PLAYER", lx + S*0.075, hy, S*0.020, "rgba(246,242,255,.40)", "left", null, "normal");
    txt(g, "TRIES",  lx + listW - S*0.225, hy, S*0.020, "rgba(246,242,255,.40)", "right", null, "normal");
    txt(g, "COINS",  lx + listW - S*0.155, hy, S*0.020, "rgba(246,242,255,.40)", "center", null, "normal");
    txt(g, "BEST",   lx + listW - S*0.022, hy, S*0.020, "rgba(246,242,255,.40)", "right", null, "normal");
  }

  for(var r=0;r<shown;r++){
    var e = rows[r], y = ly + r*rowH;
    var mine = (e.id === Leaderboard.myId());
    if(mine || r%2===0){
      roundRect(g, lx, y, listW, rowH-4, 6);
      g.fillStyle = mine ? "rgba(45,226,230,.16)" : "rgba(20,11,46,.5)";
      g.fill();
      if(mine){ g.strokeStyle = COLORS.cyan; g.lineWidth = 1.5; g.stroke(); }
    }
    var cy = y + (rowH-4)/2;
    var medal = r===0 ? COLORS.gold : r===1 ? "#cfd8e8" : r===2 ? "#d08b52" : "rgba(246,242,255,.55)";
    txt(g, String(r+1), lx + S*0.022, cy, S*0.030, medal, "left");
    txt(g, e.name || "???", lx + S*0.075, cy, S*0.030, mine ? COLORS.ink : "rgba(246,242,255,.86)", "left");

    txt(g, String(e.attempts || 0), lx + listW - S*0.225, cy, S*0.026,
        "rgba(246,242,255,.66)", "right", null, "normal");

    for(var c=0;c<3;c++){
      var ccx = lx + listW - S*0.185 + c*S*0.030;
      g.beginPath(); g.arc(ccx, cy, S*0.011, 0, 6.2832);
      g.fillStyle = (e.coins > c) ? COLORS.gold : "rgba(246,242,255,.13)";
      g.fill();
    }
    var pctCol = e.pct >= 1 ? COLORS.lime : COLORS.ink;
    txt(g, (e.pct >= 1 ? "100" : Math.floor(e.pct*100)) + "%", lx + listW - S*0.022, cy,
        S*0.030, pctCol, "right");
  }

  /* actions */
  var bw = Math.min(W*0.26, 230), bh = Math.max(40, S*0.07), gp2 = S*0.014;
  var byy = H*0.87;
  if(btn(g, Leaderboard.name ? ("NAME: " + Leaderboard.name) : "CLAIM NAME",
         W/2 - bw - gp2/2, byy, bw, bh, {accent:COLORS.gold})) NameEntry.show();
  if(btn(g, "BACK", W/2 + gp2/2, byy, bw, bh)) Game.scene = "select";
  endUI();

  var q = Leaderboard.queued();
  if(q){
    txt(g, q + (q === 1 ? " result" : " results") + " waiting to sync" +
           (Leaderboard.name ? "" : " - claim a name to post them"),
        W/2, byy - S*0.03, S*0.022, COLORS.gold, "center", null, "normal");
  }

  if(!Leaderboard.configured()){
    txt(g, "Set LEADERBOARD.apiKey and projectId in index.html to share scores online.",
        W/2, H - S*0.028, S*0.021, "rgba(246,242,255,.34)", "center", null, "normal");
  }
}

/* ==========================================================================
   Level editor. Snap-to-grid placement, a palette, instant testing, and
   import/export through the same JSON schema the shipped levels use, so a
   level built here drops straight into assets/levels/.
   ========================================================================== */

var EDITOR_PALETTE = [
  "spike","spike-mini","spike-triple","block","block-half","slope","saw",
  "pad-yellow","pad-pink","pad-red","pad-blue",
  "orb-yellow","orb-pink","orb-red","orb-blue","orb-green","orb-dash",
  "coin",
  "portal-cube","portal-ship","portal-ball","portal-ufo","portal-wave","portal-robot",
  "portal-gravity-up","portal-gravity-down","portal-mini","portal-big",
  "portal-dual","portal-mirror",
  "speed-slow","speed-normal","speed-fast","speed-faster","speed-fastest",
  "finish"
];

var Editor = {
  src: null, level: null, sim: null,
  camX: 0, sel: 0, rot: 0,
  io: null, ioMode: null, returnScene: "select",

  init: function(){
    this.io = document.getElementById("io");
    var self = this;
    // A saved draft survives reloads; it is kept separately from progress.
    try {
      var raw = localStorage.getItem("neon-dash-editor-v1");
      if(raw) this.draft = JSON.parse(raw);
    } catch(e){}
  },

  open: function(srcLevel){
    this.src = JSON.parse(JSON.stringify(srcLevel || this.draft || {
      meta:{ id:"custom", name:"My Level", difficulty:"normal", bpm:128,
             musicOffsetMs:0, startMode:"cube", startSpeed:1, lengthBlocks:120,
             bgColor:"#140B2E", groundColor:"#241148" },
      objects:[]
    }));
    this.camX = 0;
    this.rebuild();
    Game.scene = "editor";
  },

  rebuild: function(){
    this.level = parseLevel(this.src);
    this.sim = createSim(this.level);   // only for the used[] flags drawWorld reads
  },

  save: function(){
    this.draft = JSON.parse(JSON.stringify(this.src));
    try { localStorage.setItem("neon-dash-editor-v1", JSON.stringify(this.draft)); setHint("Draft saved"); }
    catch(e){ setHint("Storage blocked - could not save"); }
  },

  showIO: function(mode){
    this.ioMode = mode;
    this.io.classList.add("on");
    this.io.value = (mode === "export") ? JSON.stringify(this.src, null, 2) : "";
    this.io.readOnly = (mode === "export");
    this.io.focus();
    if(mode === "export") this.io.select();
  },

  hideIO: function(commit){
    if(commit && this.ioMode === "import"){
      try {
        var parsed = JSON.parse(this.io.value);
        if(!parsed.meta || !parsed.objects) throw new Error("missing meta/objects");
        this.src = parsed;
        this.rebuild();
        setHint("Imported " + parsed.objects.length + " objects");
      } catch(err){ setHint("Import failed: " + err.message); }
    }
    this.io.classList.remove("on");
    this.io.blur();
    this.ioMode = null;
  },

  test: function(){
    // Testing swaps the edited level in without touching the shipped three.
    var lv = parseLevel(this.src);
    Game.level = lv;
    Game.practice = false;
    Game.checkpoints = [];
    Game.attempts = 0;
    Sound.setLevel(lv);
    View.smoothY = null;
    retry(true);
    Game.scene = "play";
    Game.editorReturn = true;
  }
};

function sceneEditor(g, v, dt){
  var W = v.w, H = v.h, S = Math.min(W,H), U = PHYS.UNIT;
  var E = Editor;
  if(!E.src){ E.open(null); return; }
  UI.click = Input.takeClick();

  /* ---- view: free pan, no player to follow --------------------------- */
  var scale = Math.max(H/(16.5*U), W/(34*U));
  var view = { scale:scale, camX:E.camX, camY:-2*U, w:W, h:H,
               viewW:W/scale, viewH:H/scale, shakeX:0, shakeY:0 };

  var panSpeed = 18*U*dt;
  if(Input.key("ArrowRight") || Input.key("KeyD")) E.camX += panSpeed;
  if(Input.key("ArrowLeft")  || Input.key("KeyA")) E.camX -= panSpeed;
  E.camX = Math.max(-4*U, E.camX);

  /* ---- keyboard --------------------------------------------------------- */
  if(E.ioMode){
    if(keyPressed("Escape")) E.hideIO(false);
    if(keyPressed("Enter") && E.ioMode === "import") E.hideIO(true);
  } else {
    if(keyPressed("Escape")){ Game.scene = E.returnScene; return; }
    if(keyPressed("BracketRight")) E.sel = (E.sel+1) % EDITOR_PALETTE.length;
    if(keyPressed("BracketLeft"))  E.sel = (E.sel-1+EDITOR_PALETTE.length) % EDITOR_PALETTE.length;
    if(keyPressed("KeyR")) E.rot = (E.rot+90) % 360;
    if(keyPressed("KeyT")) { E.test(); return; }
    if(keyPressed("KeyS")) E.save();
    if(keyPressed("KeyE")) E.showIO("export");
    if(keyPressed("KeyI")) E.showIO("import");
  }

  drawBackground(g, view, E.level, GameTime, 0);
  drawGround(g, view, E.level, GameTime, 0);
  drawWorld(g, view, E.level, E.sim, GameTime);

  /* ---- grid ------------------------------------------------------------- */
  g.save();
  g.globalAlpha = 0.16; g.strokeStyle = COLORS.ink; g.lineWidth = 1;
  g.beginPath();
  var gx0 = Math.floor(view.camX/U)*U;
  for(var wx=gx0; wx < view.camX+view.viewW+U; wx+=U){
    var sx = toX(view, wx); g.moveTo(sx, 0); g.lineTo(sx, H);
  }
  for(var wy=0; wy <= (PHYS.CEIL_BLOCKS+1)*U; wy+=U){
    var sy = toY(view, wy); g.moveTo(0, sy); g.lineTo(W, sy);
  }
  g.stroke();
  g.restore();

  /* ---- palette strip ----------------------------------------------------- */
  var ph = Math.max(44, S*0.085), py = H - ph - 6;
  g.fillStyle = "rgba(10,5,24,.88)"; g.fillRect(0, py-4, W, ph+10);
  g.strokeStyle = "rgba(45,226,230,.35)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, py-4); g.lineTo(W, py-4); g.stroke();

  // The palette is wider than any screen, so it scrolls to keep the selected
  // entry centred, clamped so neither end can be scrolled past.
  var cell = ph*0.86, pad = cell*0.16, total = EDITOR_PALETTE.length;
  var step = cell+pad, fullW = total*step;
  var startX = (fullW <= W-16) ? (W-fullW)/2
             : clamp(W/2 - (E.sel+0.5)*step, W-fullW-8, 8);
  var overPalette = Input.pointer.y >= py-4;
  for(var i=0;i<total;i++){
    var x = startX + i*(cell+pad), y = py + (ph-cell)/2;
    if(x+cell < 0 || x > W) continue;
    var on = (i === E.sel);
    roundRect(g, x, y, cell, cell, cell*0.16);
    g.fillStyle = on ? "rgba(45,226,230,.25)" : "rgba(36,17,72,.7)"; g.fill();
    g.strokeStyle = on ? COLORS.cyan : "rgba(246,242,255,.22)"; g.lineWidth = on?2:1; g.stroke();
    var key = EDITOR_PALETTE[i];
    if(key !== "finish"){
      var d = OBJ[key], iw = cell*0.74, ih = iw*(d.h/d.w);
      if(ih > cell*0.8){ ih = cell*0.8; iw = ih*(d.w/d.h); }
      g.save(); g.translate(x+(cell-iw)/2, y+(cell-ih)/2);
      g.drawImage(Assets.get(d.sprite, iw) || ProcCache.get(d.sprite, iw, ih), 0, 0, iw, ih);
      g.restore();
    } else {
      txt(g, "END", x+cell/2, y+cell/2, cell*0.28, COLORS.lime, "center");
    }
    if(overPalette && UI_clickAt(x, y, cell, cell)) E.sel = i;
  }

  /* ---- cursor and placement ----------------------------------------------- */
  var p = Input.pointer;
  if(!overPalette && !E.ioMode){
    var wxg = Math.floor((p.x/scale + view.camX)/U);
    var wyg = Math.floor(((H - p.y)/scale + view.camY)/U);
    wyg = clamp(wyg, 0, PHYS.CEIL_BLOCKS);
    var key2 = EDITOR_PALETTE[E.sel];
    var d2 = key2 === "finish" ? OBJ["finish"] : OBJ[key2];

    g.save(); g.globalAlpha = 0.55;
    var sx2 = toX(view, wxg*U), sy2 = toY(view, (wyg+d2.h)*U);
    g.strokeStyle = COLORS.gold; g.lineWidth = 2;
    g.strokeRect(sx2, sy2, d2.w*U*scale, d2.h*U*scale);
    if(d2.sprite){
      g.translate(sx2, sy2);
      var gw = d2.w*U*scale, gh = d2.h*U*scale;
      g.drawImage(Assets.get(d2.sprite, gw) || ProcCache.get(d2.sprite, gw, gh), 0, 0, gw, gh);
    }
    g.restore();

    if(UI.click || (Input.pointer.down && Input.key("ShiftLeft"))){
      var erase = Input.key("ShiftLeft") || Input.key("ShiftRight");
      var idx = -1;
      for(var o=0;o<E.src.objects.length;o++){
        var ob = E.src.objects[o], od = OBJ[ob.t];
        if(!od) continue;
        if(wxg >= ob.x && wxg < ob.x+od.w && wyg >= ob.y && wyg < ob.y+od.h){ idx = o; break; }
      }
      if(erase){
        if(idx >= 0){ E.src.objects.splice(idx,1); E.rebuild(); }
      } else {
        if(idx >= 0) E.src.objects.splice(idx,1);
        var no = { t:key2, x:wxg, y:wyg };
        if(E.rot) no.rot = E.rot;
        E.src.objects.push(no);
        if(key2 === "finish") E.src.meta.lengthBlocks = wxg;
        else E.src.meta.lengthBlocks = Math.max(E.src.meta.lengthBlocks||0, wxg+6);
        E.rebuild();
      }
    }
  }
  UI.click = false;

  /* ---- header ------------------------------------------------------------- */
  var hs = Math.max(11, S*0.024);
  g.fillStyle = "rgba(10,5,24,.8)"; g.fillRect(0,0,W,hs*3.1);
  txt(g, "EDITOR  -  " + E.src.meta.name, 10, hs*1.0, hs*1.1, COLORS.ink, "left", COLORS.cyan);
  txt(g, EDITOR_PALETTE[E.sel] + (E.rot?"  rot "+E.rot:"") +
         "   |   " + E.src.objects.length + " objects   |   block " +
         Math.round(E.camX/U), 10, hs*2.2, hs*0.92, "rgba(246,242,255,.7)", "left", null, "normal");
  txt(g, "[ ] type   R rotate   shift+click erase   T test   S save   E export   I import   esc back",
      W-10, hs*1.6, hs*0.85, "rgba(246,242,255,.55)", "right", null, "normal");

  if(E.ioMode){
    txt(g, E.ioMode === "export" ? "Copy this JSON (esc to close)"
                                 : "Paste level JSON, then Enter (esc to cancel)",
        W/2, H*0.10, hs*1.2, COLORS.gold, "center", COLORS.gold);
  }
  if(Game.hintT > 0){
    Game.hintT -= dt;
    txt(g, Game.hint, W/2, H - ph - hs*2.4, hs*1.05, COLORS.ink, "center", COLORS.violet);
  }
}

/* Hit test against the click that beginUI() latched for this frame. */
function UI_clickAt(x,y,w,h){
  var p = Input.pointer;
  return UI.click && p.x>=x && p.x<=x+w && p.y>=y && p.y<=y+h;
}

/* ==========================================================================
   Game. A fixed-step accumulator drives the physics at 240 Hz while rendering
   runs free, so the feel of the game is identical on a 60 Hz laptop and a
   144 Hz monitor. The clock comes from WebAudio when it exists, which is what
   keeps the obstacles welded to the beat.
   ========================================================================== */

var cv, ctx, Game = {
  scene: "menu",
  levelIndex: 0, level: null, sim: null,
  attempts: 0, practice: false, checkpoints: [],
  deadT: 0, bannerT: 0, shakeT: 0, shakeMag: 0,
  hint: "", hintT: 0,
  acc: 0, last: 0,
  scoreLevel: 0,
  fpsSmooth: 60
};

function setHint(s){ Game.hint = s; Game.hintT = 2.6; }

function startLevel(i, practice){
  Game.levelIndex = clamp(i, 0, LEVELS.length-1);
  Game.level = LEVELS[Game.levelIndex];
  Game.practice = !!practice;
  Game.checkpoints = [];
  Game.attempts = 0;
  Save.data.lastLevel = Game.levelIndex;
  Sound.init();
  Sound.setLevel(Game.level);
  View.smoothY = null;
  retry(true);
  Game.scene = "play";
}

function retry(fromStart){
  var cp = (!fromStart && Game.practice && Game.checkpoints.length)
           ? Game.checkpoints[Game.checkpoints.length-1] : null;
  Game.sim = cp ? cloneSim(cp) : createSim(Game.level);
  Game.attempts++;
  Save.data.totalAttempts++;
  Save.level(Game.level.meta.id).attempts++;
  Game.deadT = 0; Game.bannerT = 1.0; Game.acc = 0; Game.shakeT = 0;
  Particles.clear();
  Input.pressLatch = false;
  Sound.start(cp ? cp.t : 0);
  if(fromStart) View.smoothY = null;
}

function togglePractice(){
  Game.practice = !Game.practice;
  Game.checkpoints = [];
  setHint(Game.practice ? "Practice mode - Z places a checkpoint, X removes one"
                        : "Practice mode off");
  retry(true);
}

function recordProgress(){
  var rec = Save.level(Game.level.meta.id);
  var p = Game.sim.progress;
  if(Game.practice){
    if(p > rec.practiceBest) rec.practiceBest = p;
    Save.flush();
    return;                       // practice never reaches the board
  }
  if(p > rec.best) rec.best = p;
  Save.flush();
  // Queued after every failed run, not just a new best: on a level nobody has
  // finished, the attempt count is the number people actually watch.
  Leaderboard.noteRun(Game.level.meta.id, rec.best,
                      rec.coins[0]+rec.coins[1]+rec.coins[2], rec.attempts);
}

function finishLevel(){
  var rec = Save.level(Game.level.meta.id);
  if(!Game.practice){
    rec.completed = true;
    rec.best = 1;
    for(var i=0;i<3;i++) if(Game.sim.coins[i]) rec.coins[i] = 1;
  }
  Save.flush();
  if(!Game.practice){
    Leaderboard.record(Game.level.meta.id, 1,
                      rec.coins[0]+rec.coins[1]+rec.coins[2], rec.attempts);
  }
  Sound.sfx("win");
  Sound.stop();
  Particles.burst(Game.sim.ents[0].x, Game.sim.ents[0].y, COLORS.lime, 60, 520);
  Game.scene = "end";
}

/* ---- drawing the playfield (shared by play, pause and end) ----------------- */
function drawPlayfield(g, v, dt){
  var level = Game.level, sim = Game.sim;
  drawBackground(g, v, level, GameTime, Sound.bass);
  drawGround(g, v, level, GameTime, Sound.bass);

  g.save();
  if(sim.mirrorView){                       // mirror portal: flip the world, not the HUD
    var axis = toX(v, sim.ents[0].x);
    g.translate(axis*2, 0); g.scale(-1, 1);
  }
  drawWorld(g, v, level, sim, GameTime);
  for(var i=0;i<sim.ents.length;i++) if(sim.ents[i].alive) drawPlayer(g, v, sim.ents[i], GameTime);
  Particles.draw(g, v);
  if(Save.data.settings.showHitboxes) drawHitboxes(g, v, level, sim);
  g.restore();

  // practice checkpoint flags
  if(Game.practice){
    for(var c=0;c<Game.checkpoints.length;c++){
      var cp = Game.checkpoints[c], e = cp.ents[0];
      var x = toX(v, e.x), y = toY(v, e.y);
      g.save();
      g.globalAlpha = 0.85; g.shadowColor = COLORS.lime; g.shadowBlur = 14;
      g.fillStyle = COLORS.lime;
      g.fillRect(x-1.5, y-22*v.scale, 3, 24*v.scale);
      g.beginPath(); g.moveTo(x+1, y-22*v.scale);
      g.lineTo(x+16*v.scale, y-17*v.scale); g.lineTo(x+1, y-12*v.scale);
      g.closePath(); g.fill();
      g.restore();
    }
  }
}

/* ---- the play scene ---------------------------------------------------------- */
function scenePlay(g, v, dt){
  var sim = Game.sim, lead = sim.ents[0];

  if(keyPressed("Escape")){ Game.scene = "pause"; return; }
  if(keyPressed("KeyR")) retry(true);
  if(keyPressed("KeyP")) togglePractice();
  if(keyPressed("KeyH")){
    Save.data.settings.showHitboxes = !Save.data.settings.showHitboxes;
    setHint("Hitboxes " + (Save.data.settings.showHitboxes ? "on" : "off"));
  }
  if(Game.practice){
    if(keyPressed("KeyZ") && !sim.dead){
      Game.checkpoints.push(cloneSim(sim));
      Sound.sfx("click"); setHint("Checkpoint placed");
    }
    if(keyPressed("KeyX") && Game.checkpoints.length){
      Game.checkpoints.pop(); Sound.sfx("click"); setHint("Checkpoint removed");
    }
  }

  /* ---- fixed-step physics --------------------------------------------- */
  if(!sim.dead && !sim.won){
    Game.acc += dt;
    var budget = 0;
    while(Game.acc >= PHYS.TIMESTEP && budget < 600){
      var hold = Input.down;
      if(Input.pressLatch){ hold = true; Input.pressLatch = false; }
      simInput(sim, hold);
      stepSim(sim, PHYS.TIMESTEP);
      Game.acc -= PHYS.TIMESTEP;
      budget++;
      if(sim.dead || sim.won) break;
    }
    if(budget >= 600) Game.acc = 0;          // a long stall must not fast-forward the level
  }

  /* ---- react to what the simulation reported --------------------------- */
  for(var i=0;i<sim.events.length;i++){
    var evd = sim.events[i];
    switch(evd.type){
      case "death":
        Particles.burst(evd.x, evd.y, MODE_TINT[evd.mode]||COLORS.magenta, 36, 520);
        Particles.burst(evd.x, evd.y, COLORS.ink, 14, 300);
        Sound.sfx("death");
        Game.shakeT = Save.data.settings.reducedMotion ? 0 : 0.12;
        Game.shakeMag = Math.min(v.w,v.h)*0.016;
        break;
      case "orb": case "pad":
        Particles.burst(evd.x, evd.y, ORB_TINT[evd.extra] || COLORS.gold, 12, 220);
        Sound.sfx(evd.type);
        break;
      case "coin":
        Particles.burst(evd.x, evd.y, COLORS.gold, 24, 260);
        Sound.sfx("coin");
        break;
      case "portal": case "speed": case "mirror":
        Particles.burst(evd.x, evd.y, COLORS.violet, 20, 300);
        Sound.sfx("portal");
        break;
      case "jump": case "flip":
        Particles.burst(evd.x, evd.y - 10, MODE_TINT[evd.mode]||COLORS.cyan, 4, 120);
        break;
      case "win":
        break;
    }
  }
  sim.events.length = 0;

  if(sim.won && Game.scene === "play"){ finishLevel(); return; }

  /* ---- trail ------------------------------------------------------------ */
  if(!sim.dead){
    for(var k=0;k<sim.ents.length;k++){
      var e = sim.ents[k];
      if(!e.alive) continue;
      var b = entBox(e);
      Particles.trail(e.x - b.w*0.45, e.y - b.h*0.2*e.grav, MODE_TINT[e.mode]||COLORS.cyan, e.vx);
    }
  }

  /* ---- death and retry -------------------------------------------------- */
  if(sim.dead){
    if(Game.deadT === 0) recordProgress();
    Game.deadT += dt;
    var wants = Input.takePress();
    if(wants || (Save.data.settings.autoRetry && Game.deadT > 0.55)) retry(false);
  }

  Particles.update(dt);
  if(Game.bannerT > 0) Game.bannerT -= dt;
  if(Game.hintT > 0) Game.hintT -= dt;

  drawPlayfield(g, v, dt);
  drawHUD(g, v, Game);
}

/* ---- main loop ------------------------------------------------------------- */
function resize(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = Math.max(320, window.innerWidth), h = Math.max(240, window.innerHeight);
  cv.width  = Math.floor(w*dpr);
  cv.height = Math.floor(h*dpr);
}

function frame(){
  requestAnimationFrame(frame);

  var now = Sound.clock();
  var dt = now - Game.last;
  Game.last = now;
  if(!(dt > 0) || dt > 0.25) dt = 1/60;        // first frame, tab switch, or a stall
  GameTime += dt;
  Game.fpsSmooth += (1/dt - Game.fpsSmooth)*0.05;

  Sound.update();

  var v = computeView(cv, Game.sim, Game.scene === "play" ? dt : 0);
  if(Game.shakeT > 0){
    Game.shakeT -= dt;
    var m = Game.shakeMag * Math.max(0, Game.shakeT/0.12);
    v.shakeX = (Math.random()-0.5)*m*2;
    v.shakeY = (Math.random()-0.5)*m*2;
  } else { v.shakeX = 0; v.shakeY = 0; }

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);

  switch(Game.scene){
    case "menu":     sceneMenu(ctx, v, dt); break;
    case "select":   sceneSelect(ctx, v, dt); break;
    case "settings": sceneSettings(ctx, v, dt); break;
    case "play":     scenePlay(ctx, v, dt); break;
    case "pause":    scenePause(ctx, v, dt); break;
    case "end":      sceneEnd(ctx, v, dt); break;
    case "scores":   sceneScores(ctx, v, dt); break;
    case "editor":   sceneEditor(ctx, v, dt); break;
  }

  drawNameOverlay(ctx, v);
}

function boot(){
  cv = document.getElementById("game");
  ctx = cv.getContext("2d", { alpha:false });
  resize();
  addEventListener("resize", resize);
  addEventListener("orientationchange", function(){ setTimeout(resize, 120); });

  Save.load();
  try {
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
      Save.data.settings.reducedMotion = true;
  } catch(e){}

  Assets.init();
  Particles.init(700);
  Input.init(cv);
  Input.applyBinds();
  Editor.init();
  NameEntry.init();
  Leaderboard.init();
  Leaderboard.load(LEVELS[0].meta.id);

  // WebAudio may only start from a gesture, so try on every early interaction.
  function unlock(){ Sound.init(); Sound.resume(); Sound.applyVolumes(); }
  addEventListener("pointerdown", unlock);
  addEventListener("keydown", unlock);
  addEventListener("touchstart", unlock);

  // Prompt for a nickname on entry so scores have an owner from the first run.
  // Skippable with Escape; anything played before it is claimed is queued and
  // sent the moment a name exists.
  if(!Save.data.playerName){
    setTimeout(function(){ if(!Leaderboard.name) NameEntry.show(); }, 1800);
  }

  Game.level = LEVELS[0];
  Game.sim = createSim(Game.level);
  Game.last = Sound.clock();
  requestAnimationFrame(frame);
}

boot();

</script>
