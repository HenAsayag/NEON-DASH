<title>NEON DASH — ספריית נכסים</title>
<style>
  :root { --void:#140B2E; --deep:#241148; --cyan:#2DE2E6; --magenta:#FF3864; --gold:#F9C80E; --ink:#F6F2FF; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 24px 64px; background:var(--void); color:var(--ink);
         font-family: "Segoe UI", Arial, sans-serif; line-height:1.6; }
  header { max-width:1100px; margin:0 auto 40px; border-bottom:2px solid var(--cyan); padding-bottom:20px; }
  h1 { font-size:34px; margin:0 0 6px; letter-spacing:2px; }
  header p { margin:0; opacity:.75; }
  section { max-width:1100px; margin:0 auto 40px; }
  h2 { font-size:19px; color:var(--gold); margin:0 0 14px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  figure { margin:0; background:var(--deep); border:1px solid rgba(45,226,230,.35); border-radius:10px;
            padding:16px 10px 10px; text-align:center; }
  figure img { display:block; margin:0 auto 12px; max-width:110px; max-height:90px; image-rendering:auto; }
  figcaption { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:10.5px; opacity:.7;
                direction:ltr; word-break:break-all; }
</style>
